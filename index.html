*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;background:radial-gradient(circle at 50% 50%,var(--bg1),var(--bg2));display:flex;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sidebar{width:280px;flex:none;background:var(--glass);border-right:1px solid var(--line);backdrop-filter:blur(12px);display:flex;flex-direction:column;overflow-y:auto;box-shadow:5px 0 25px rgba(0,0,0,.5);z-index:2}
.sidebar h2{text-align:center;letter-spacing:4px;margin:25px 0;font-weight:800;text-transform:uppercase;text-shadow:0 0 15px rgba(255,255,255,.6)}
[role=tablist]{display:flex;flex-direction:column}
.tab{background:none;border:0;border-left:4px solid transparent;color:var(--muted);padding:15px 28px;text-align:left;font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:14px;cursor:pointer;transition:background .25s,color .25s,transform .3s var(--ease);white-space:nowrap}
.tab:hover{background:rgba(255,255,255,.05);color:#fff;transform:translateX(5px)}
.tab[aria-selected=true]{color:var(--tc);background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 18%,transparent),transparent)}
.tools{margin-top:auto;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tools button{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:8px;padding:9px 6px;font-size:12px;font-weight:700;letter-spacing:.5px;cursor:pointer;transition:background .2s,transform .15s}
.tools button:hover{background:rgba(255,255,255,.16)}
.tools .wide{grid-column:1/-1;background:color-mix(in srgb,var(--accent) 25%,transparent);border-color:var(--accent)}
main{flex:1;overflow-y:auto;padding:50px}
.page{max-width:1200px;min-height:100%;margin:0 auto;display:flex;gap:50px;align-items:center}
.imgs{flex:1;max-width:450px;display:flex;flex-direction:column;gap:14px}
.frame{aspect-ratio:3/4;background:#000;border:2px solid var(--accent);border-radius:16px;overflow:hidden;box-shadow:0 0 40px color-mix(in srgb,var(--accent) 28%,transparent),0 15px 35px rgba(0,0,0,.8);transition:transform .3s var(--ease),box-shadow .3s}
.frame.drag{transform:scale(1.02);box-shadow:0 0 60px var(--accent)}
.frame img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.frame:hover img{transform:scale(1.05)}
.row{display:flex;gap:8px}
.btn{flex:1;text-align:center;background:var(--glass);border:1px solid var(--line);border-radius:8px;padding:13px;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:background .25s,border-color .25s,transform .15s}
.btn:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.35)}
.btn input{display:none}
.btn:focus-within{outline:2px solid var(--accent)}
.info{flex:1.2}
h1{font-size:clamp(2rem,5.5vw,4.5rem);margin:0 0 20px;text-transform:uppercase;font-weight:900;line-height:1.1;text-shadow:0 0 30px var(--accent)}
.desc{font-size:clamp(1rem,1.6vw,1.4rem);color:var(--muted);line-height:1.7;font-weight:300}
[contenteditable]{outline:0;border-bottom:2px solid transparent;border-radius:8px 8px 0 0;transition:background .25s,border-color .25s;padding:2px 6px;margin-left:-6px}
[contenteditable]:hover{background:rgba(255,255,255,.03)}
[contenteditable]:focus{border-bottom:2px dashed rgba(255,255,255,.45);background:rgba(255,255,255,.05)}
.hint{margin-top:18px;font-size:12px;color:#8a8a98;letter-spacing:1px;text-transform:uppercase}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);background:#000d;border:1px solid var(--line);padding:10px 20px;border-radius:30px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s var(--ease);z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:800px){
body{flex-direction:column;overflow:auto;height:auto;min-height:100%}
.sidebar{width:100%;flex-direction:row;align-items:center;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);position:sticky;top:0}
.sidebar h2{display:none}
[role=tablist]{flex-direction:row}
.tab{border-left:0;border-bottom:3px solid transparent;padding:14px 16px}
.tab:hover{transform:none}
.tab[aria-selected=true]{background:none}
.tools{margin:0;display:flex;padding:8px}
.tools button{white-space:nowrap}
main{padding:24px 18px;overflow:visible}
.page{flex-direction:column;gap:26px}
.imgs{max-width:420px;width:100%}
}
#fx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
@keyframes fxin{from{opacity:0}}
main{position:relative;z-index:1}
.fx{position:absolute}
.fx svg{display:block;width:100%;height:100%;overflow:visible}
.spin{animation:spin 12s linear infinite}.rev{animation:spin 10s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flo{0%,100%{transform:translateY(0)}50%{transform:translateY(-4vh)}}
@keyframes pul{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.1);opacity:.9}}
@keyframes flk{0%,100%{opacity:.85;transform:scaleY(1)}50%{opacity:1;transform:scaleY(1.12)}}
@keyframes sq{0%,100%{transform:scale(1,1)}50%{transform:scale(1.1,.9)}}
@keyframes slash{0%{transform:translate(-15%,15%) rotate(var(--r));opacity:0}20%{opacity:1}100%{transform:translate(25%,-25%) rotate(var(--r));opacity:0}}
@keyframes rpm{0%{transform:rotate(-120deg)}50%{transform:rotate(40deg)}70%{transform:rotate(120deg)}100%{transform:rotate(-120deg)}}
@keyframes speed{0%{background-position:0 0}100%{background-position:200px 0}}
.orb{border-radius:50%}
.slime{border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 35% 30%,#fffa,#00aaffaa 35%,#0077cc88 75%);box-shadow:inset -8px -10px 20px #0066cc66,0 0 40px #00aaff55;animation:sq 3.2s ease-in-out infinite,flo 6s ease-in-out infinite}
.slime i{position:absolute;top:42%;width:8%;height:11%;background:#012;border-radius:50%}
/* Character artwork backgrounds */
.abg,.afg,.ashade{position:absolute}
.abg,.ashade{inset:0}
.abg{background:var(--img) center/cover no-repeat}
.abg.blur{filter:blur(24px) brightness(.55) saturate(1.2);transform:scale(1.15)}
.abg.zoom{animation:mzoom 16s ease-in-out infinite alternate}
.afg{top:0;bottom:0;right:3vw;background:var(--img) center/cover no-repeat;animation:mzoom 16s ease-in-out infinite alternate;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
.ashade{background:linear-gradient(90deg,rgba(5,5,8,.5),rgba(5,5,8,.08) 55%,transparent)}
.desc,h1{text-shadow:0 2px 12px #000,0 0 24px #000a}
.desc{color:#d6d6e2}
@keyframes mzoom{from{transform:scale(1)}to{transform:scale(1.05)}}
@media(max-width:800px){.afg{left:0;right:0;aspect-ratio:auto!important;-webkit-mask-image:none;mask-image:none;opacity:.75}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Motion system ===== */
@property --accent{syntax:'<color>';inherits:true;initial-value:#ff0000}
:root{--ease:cubic-bezier(.165,.84,.44,1)}
html{transition:--accent .6s ease}

/* Entrance: only on character change, staggered, direction-aware */
@keyframes rise{from{opacity:0;transform:translate3d(calc(var(--dir,0)*28px),18px,0)}}
@keyframes imgin{from{transform:scale(1.12)}}
.page.enter .imgs{animation:rise .65s var(--ease) backwards}
.page.enter h1{animation:rise .65s .09s var(--ease) backwards}
.page.enter .desc{animation:rise .65s .17s var(--ease) backwards}
.page.enter .hint{animation:rise .65s .25s var(--ease) backwards}
.page.enter .frame img{animation:imgin .95s .05s var(--ease) backwards}

/* Background layers crossfade instead of hard-cutting */
.fxl{position:absolute;inset:0;scale:1.04;animation:fxin .5s var(--ease)}
.fxl.out{animation:fxout .5s forwards}
@keyframes fxout{to{opacity:0}}

/* Sliding tab indicator */
#tabs{position:relative}
#ind{position:absolute;left:0;top:0;width:4px;height:var(--h,0);background:var(--accent);box-shadow:0 0 14px var(--accent);border-radius:0 3px 3px 0;transform:translateY(var(--y,0));transition:transform .45s var(--ease),height .45s var(--ease),width .45s var(--ease);pointer-events:none}
#ind.snap{transition:none}
@media(max-width:800px){#ind{top:auto;bottom:0;height:3px;width:var(--w,0);border-radius:3px 3px 0 0;transform:translateX(var(--x,0))}}

/* Ambient sparks (compositor-only: transform + opacity) */
.sparks{position:absolute;inset:0;overflow:hidden}
.sparks i{position:absolute;bottom:-4vh;border-radius:50%;opacity:0;will-change:transform,opacity;animation:ember linear infinite}
@keyframes ember{0%{opacity:0;transform:translate3d(0,0,0)}12%{opacity:.85}100%{opacity:0;transform:translate3d(var(--dx),-110vh,0) scale(.5)}}

/* Kanata road lines: transform instead of background-position */
@keyframes speedx{to{transform:translateX(200px)}}

/* Perf hints + press feedback */
.spin,.rev,.abg.zoom,.afg{will-change:transform}
.btn:active,.tools button:active{transform:scale(.97)}
html.paused #fx *{animation-play-state:paused!important}

/* ===== Motion v2 ===== */
.aura{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.aura i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 30%,transparent),transparent 65%);opacity:.5;will-change:transform;animation:orb 18s ease-in-out infinite alternate}
.aura i:nth-child(1){left:-15vmax;top:-20vmax}
.aura i:nth-child(2){right:-20vmax;bottom:-25vmax;animation-duration:24s;animation-direction:alternate-reverse}
@keyframes orb{to{transform:translate3d(12vmax,8vmax,0) scale(1.2)}}
#spot{position:fixed;left:0;top:0;width:640px;height:640px;margin:-320px 0 0 -320px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 18%,transparent),transparent 65%);pointer-events:none;z-index:2;opacity:0;transition:opacity .5s;will-change:transform}
.wipe{position:fixed;top:-10vh;bottom:-10vh;left:0;width:55vw;z-index:8;pointer-events:none;opacity:.85;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--accent) 60%,transparent) 40%,#fff 50%,color-mix(in srgb,var(--accent) 60%,transparent) 60%,transparent);animation:wipe .8s var(--ease) forwards}
@keyframes wipe{from{transform:translate3d(var(--f),0,0) skewX(-18deg)}to{transform:translate3d(var(--t),0,0) skewX(-18deg)}}
h1{position:relative}
.page.enter h1{animation:htxt .8s .09s var(--ease) backwards}
.page.enter h1::after{content:'';position:absolute;inset:0;background:var(--accent);pointer-events:none;animation:hbar .8s .09s var(--ease) forwards}

@keyframes opin{from{opacity:0;transform:translateX(-18px)}}

.dots span.d{background:#22c55e}.dots span.x{background:#ef4444}.dots span.cur{background:rgba(255,255,255,.55);animation:blink 1s infinite}

@media(prefers-reduced-motion:reduce){.op,.qz *{animation:none!important}}

<body>

<script id="seed" type="application/json">[
{"id":"itachi","name":"Itachi Uchiha","color":"#ff0000","desc":"The prodigy of the Uchiha clan. A master of the Sharingan who sacrificed everything for the Hidden Leaf Village.","img":""},
{"id":"kakashi","name":"Kakashi Hatake","color":"#00ddff","desc":"The Copy Ninja. Renowned worldwide for having copied over a thousand jutsu using his Sharingan.","img":""},
{"id":"goku","name":"Son Goku","color":"#ffaa00","desc":"A Saiyan raised on Earth. Constantly breaking his limits through intense training and unlocking new transformations.","img":""},
{"id":"gojo","name":"Satoru Gojo","color":"#ffffff","desc":"The strongest jujutsu sorcerer in the world. He possesses the revered Six Eyes and the Limitless cursed technique.","img":""},
{"id":"ichigo","name":"Ichigo Kurosaki","color":"#ff0000","desc":"A Substitute Soul Reaper with immense spiritual pressure. He wields the mighty Zanpakutō, Zangetsu.","img":""}
]</script>

<script>
(() => {
  const KEY = 'aft-roster-v3';
  const $ = s => document.querySelector(s);
  const SEED = JSON.parse($('#seed').textContent);
  let data = null, cur = 0, timer;

  try { const s = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(s) && s.length) data = s; } catch {}
  data = data || structuredClone(SEED);
  /* ===== FAN TEST ===== */
  const QZ = {
    itachi: [
      ["Which pair of items does Itachi's Susanoo carry?","Totsuka Sword and Yata Mirror",["Kusanagi and Yata Mirror","Totsuka Sword and Kusanagi","Yata Mirror and Samehada"],"The Totsuka seals what it cuts into an eternal genjutsu dream."],
      ["Which technique did Itachi use to trap Kabuto in a loop until he gave up?","Izanami",["Izanagi","Tsukuyomi","Kotoamatsukami"],"Izanami was used when Itachi was revived by Edo Tensei."],
      ["Which close friend's eye did Itachi receive after his death?","Shisui Uchiha",["Obito Uchiha","Izuna Uchiha","Kagami Uchiha"],"Danzo took Shisui's other eye."],
      ["Who was Itachi's Akatsuki partner?","Kisame Hoshigaki",["Deidara","Sasori","Hidan"],"Kisame was one of the Seven Ninja Swordsmen of the Mist."],
      ["At what age did Itachi become an ANBU captain?","13",["11","15","17"],"He passed the Chunin Exams at 10 and joined ANBU at 11."]],
    kakashi: [
      ["Which mission ended with Obito's death and Kakashi receiving his Sharingan?","Destroying Kannabi Bridge",["Rescuing Rin at Kirigakure","Defending the Sand border","Escorting the Fourth Hokage"],"Obito shielded Kakashi from a cave-in during that mission."],
      ["What was Kakashi's father Sakumo famously nicknamed?","The White Fang of Konoha",["The Copy Ninja","The Yellow Flash","The Sannin Slayer"],"Sakumo abandoned a mission to save his comrades and was shamed for it."],
      ["What did Kakashi cut with Chidori that led to its rename?","A bolt of lightning",["A waterfall","A tailed beast's claw","A kunai storm"],"The renamed technique is called Raikiri, Lightning Cutter."],
      ["Who wrote Kakashi's favourite book series, Icha Icha?","Jiraiya",["Orochimaru","Tsunade","Minato"],"Jiraiya wrote it as research for his novels."],
      ["How many bells are in Team 7's survival test?","2",["1","3","4"],"Only two bells for three students, to test teamwork."]],
    goku: [
      ["Which planet did Goku learn Instant Transmission on?","Yardrat",["Namek","Vegeta","Kaio's planet"],"The Yardratians taught it to him after his fight with Frieza."],
      ["What triggered Goku's first Super Saiyan transformation?","Frieza killing Krillin",["Gohan being hurt","Vegeta's defeat","Goku's own death"],"It happened on Namek."],
      ["Who is Goku's biological father?","Bardock",["Gine","King Vegeta","Raditz"],"Bardock tried to stop Frieza from destroying Planet Vegeta."],
      ["Which Dragon Ball did Goku keep from Grandpa Gohan?","Four-Star Ball",["Seven-Star Ball","One-Star Ball","Six-Star Ball"],"It is the memento of Grandpa Gohan."],
      ["Who taught Goku the Kaioken technique?","King Kai",["Master Roshi","Whis","Piccolo"],"He learned it on King Kai's tiny planet, after Snake Way."]],
    gojo: [
      ["Which technique sealed Gojo in the Shibuya Incident?","Prison Realm",["Domain Expansion","Binding Vow","Cursed Spirit Manipulation"],"Gojo had to be kept within range for about a minute."],
      ["Hollow Purple is the combination of which two techniques?","Cursed Technique Lapse: Blue and Reversal: Red",["Blue and Unlimited Void","Red and Infinity","Infinity and Blue"],"The two opposite forces collide to erase everything in their path."],
      ["Who nearly killed Gojo during the Star Plasma Vessel mission?","Toji Fushiguro",["Suguru Geto","Sukuna","Mahito"],"Gojo awakened reverse cursed technique in that fight."],
      ["What does Gojo's Domain Expansion Unlimited Void do to targets?","Floods the mind with infinite information, paralyzing them",["Traps them in an eternal illusion","Drains all cursed energy","Slows time around them"],"Victims are trapped in a state where they can no longer act."],
      ["Who defeated Gojo in the Shinjuku Showdown?","Ryomen Sukuna",["Kenjaku","Toji Fushiguro","Mahito"],"Sukuna used the World-Cutting Slash, an evolved Dismantle, to bisect him."]],
    ichigo: [
      ["Who transferred Shinigami powers to Ichigo?","Rukia Kuchiki",["Urahara Kisuke","Renji Abarai","Yoruichi Shihoin"],"Rukia was injured, so she transferred her power to him."],
      ["Which Hollow killed Ichigo's mother Masaki?","Grand Fisher",["Menos Grande","Ulquiorra","Aizen's Hollow"],"Ichigo was 9 at the time."],
      ["Which Gotei 13 division was Ichigo's father Isshin Captain of?","10th Division",["5th Division","3rd Division","12th Division"],"Isshin was a Shiba and left Soul Society to live in the world of the living."],
      ["What does the technique Mugetsu cost Ichigo?","His Shinigami powers",["His memories","His Zanpakuto","His life"],"It is the final Getsuga Tensho."],
      ["Which group trains Ichigo to control his Hollow mask?","The Visored",["The Gotei 13","Xcution","The Arrancar"],"Hirako Shinji leads the Visored."]]
  };
  const SC = (() => { try { return JSON.parse(localStorage.getItem('aft-r')) || {}; } catch { return {}; } })();
  const saveSc = () => { try { localStorage.setItem('aft-r', JSON.stringify(SC)); } catch {} };
  const IM = {};
  function lvl(n) { return n == 5 ? 'Mastered' : n == 4 ? 'Fan' : n == 3 ? 'Casual' : 'Newbie'; }
  function loadImg(c) {
    const set = () => { const e = document.getElementById('img'); if (e && data[cur] === c && IM[c.id]) e.src = IM[c.id].src; };
    if (IM[c.id]) return set();
    const ex = ['jpg', 'jpeg', 'png', 'webp']; let i = 0; const im = new Image();
    im.onload = () => { IM[c.id] = im; set(); };
    im.onerror = () => { if (++i < ex.length) im.src = 'images/' + c.id + '.' + ex[i]; };
    im.src = 'images/' + c.id + '.' + ex[0];
  }
  data.forEach(loadImg);
  function tabMark() { document.querySelectorAll('.tab').forEach((b, i) => { const s = data[i] && SC[data[i].id]; if (s != null) b.dataset.s = s + '/5'; else delete b.dataset.s; }); }

  let QS = null;
  document.addEventListener('keydown', e => {
    if (!QS || !document.querySelector('.op')) return;
    const k = '1234'.indexOf(e.key);
    if (k > -1 && QS.pick) return QS.pick(k);
    if (e.key === 'Enter' && QS.next && document.activeElement.tagName !== 'BUTTON') QS.next();
  });
  function burst(el, col) {
    const r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
    for (let k = 0; k < 18; k++) {
      const d = document.createElement('i'); d.className = 'cf'; d.style.cssText = `left:${x}px;top:${y}px;background:${k % 2 ? col : '#22c55e'}`; document.body.appendChild(d);
      const a = Math.random() * 6.28, v = 60 + Math.random() * 130;
      d.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${Math.cos(a) * v}px,${Math.sin(a) * v - 40}px) scale(.2)`, opacity: 0 }], { duration: 700 + Math.random() * 400, easing: 'cubic-bezier(.2,.8,.3,1)' }).onfinish = () => d.remove();
    }
  }
  function runQ(c) {
    const info = document.querySelector('.info'); let i = 0, n = 0, st = 0; const res = [];
    const qs = QZ[c.id].map(q => ({ q: q[0], a: q[1], f: q[3], o: [q[1], ...q[2]].sort(() => Math.random() - .5) }));
    QS = { pick: null, next: null };
    const draw = () => {
      const q = qs[i], L = ['A', 'B', 'C', 'D'], right = q.o.indexOf(q.a);
      info.innerHTML = `<div class="qz"><div class="qk">${esc(c.name)} · Question ${i + 1}/5<span class="stk">${st >= 2 ? ' · 🔥 ' + st + ' streak' : ''}</span></div><div class="dots">${[0,1,2,3,4].map(k => `<span class="${k < i ? (res[k] ? 'd' : 'x') : k == i ? 'cur' : ''}"></span>`).join('')}</div><h2 class="qt">${esc(q.q)}</h2>${q.o.map((o, k) => `<button class="op" data-k="${k}" style="animation-delay:${k * .07}s"><b>${L[k]}</b><span>${esc(o)}</span></button>`).join('')}<div class="fact"></div><button class="go" id="nxt">${i == 4 ? 'Finish' : 'Next'} ⏎</button></div>`;
      const ops = [...info.querySelectorAll('.op')], fact = info.querySelector('.fact'), nx = document.getElementById('nxt'); let locked = false;
      const pick = (k, ev) => {
        if (locked) return; locked = true;
        const ok = k === right; res[i] = ok; if (ok) { n++; st++; } else st = 0;
        ops.forEach((x, j) => { x.disabled = true; x.classList.add(j === right ? 'ok' : j === k ? 'no' : 'dim'); });
        if (ev) { const b = ops[k], r = b.getBoundingClientRect(), z = Math.max(r.width, r.height) * 2, p = document.createElement('i'); p.className = 'ripple'; p.style.cssText = `width:${z}px;height:${z}px;left:${ev.clientX - r.left - z / 2}px;top:${ev.clientY - r.top - z / 2}px`; b.appendChild(p); setTimeout(() => p.remove(), 700); }
        if (ok) burst(ops[k], c.color); else info.animate([{ translate: '0' }, { translate: '-10px' }, { translate: '10px' }, { translate: '-6px' }, { translate: '0' }], { duration: 350 });
        fact.textContent = (ok ? 'Correct! ' : 'Not quite. ') + 'Did you know? ' + q.f; fact.classList.add('on');
        nx.classList.add('on'); nx.onclick = QS.next = () => { QS.next = null; ++i < 5 ? draw() : done(); };
      };
      QS.pick = pick; QS.next = null;
      ops.forEach((b, k) => b.onclick = ev => pick(k, ev));
    };
    const done = () => {
      SC[c.id] = n; saveSc(); tabMark(); QS = null;
      const all = data.every(d => SC[d.id] != null);
      info.innerHTML = `<div class="qz"><div class="qk">${esc(c.name)}</div><div class="big" id="bg5">0/5</div><h2 class="qt pop">${lvl(n)}</h2><div><button class="go alt" id="again">Retake</button>${all ? '<button class="go" id="fin2">Final Result</button>' : '<button class="go" id="nextc">Next character →</button>'}</div></div>`;
      let k = 0; const tm = setInterval(() => { const e = document.getElementById('bg5'); if (!e) return clearInterval(tm); e.textContent = k + '/5'; if (k++ >= n) clearInterval(tm); }, 160);
      if (n >= 4) burst(document.getElementById('bg5'), c.color);
      document.getElementById('again').onclick = () => runQ(c);
      const f2 = document.getElementById('fin2'); if (f2) f2.onclick = showFinal;
      const nc = document.getElementById('nextc'); if (nc) nc.onclick = () => go(cur + 1);
    };
    draw();
  }

  /* ----- final result, share, signed challenge link ----- */
  const HS = s => { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); };
  const up = new URLSearchParams(location.search); let fr = null, bad = false;
  if (up.get('s')) {
    const sv = up.get('s').split(',').map(Number), nm0 = up.get('n') || 'Friend';
    if (sv.length == data.length && sv.every(v => v >= 0 && v <= 5) && up.get('k') == HS(nm0 + '|' + sv.join(',') + '|aft-v3')) fr = { n: nm0, s: sv }; else bad = true;
  }
  if (fr || bad) { const b = document.createElement('div'); b.className = 'chb'; b.textContent = bad ? 'This challenge link looks edited, so its score is not verified.' : `${fr.n} scored ${fr.s.reduce((a, b) => a + b, 0)}/${data.length * 5}. Beat them!`; document.body.appendChild(b); }
  const stats = () => ({ m: data.filter(d => SC[d.id] == 5).length, know: data.filter(d => SC[d.id] >= 4).length, t: data.reduce((a, d) => a + (SC[d.id] || 0), 0) });
  const rankOf = m => m == data.length ? 'Six-Eyes Level' : m >= 3 ? 'Sage' : m >= 2 ? 'Otaku' : 'Casual Watcher';
  const fin = document.createElement('div'); fin.id = 'fin'; fin.hidden = true; document.body.appendChild(fin);
  document.getElementById('finBtn').onclick = () => {
    const left = data.filter(d => SC[d.id] == null).length;
    left ? toast(`Pehle ${left} aur character ka test do`) : showFinal();
  };

    nm.addEventListener('blur', () => { const b = $(`.tab[data-i="${cur}"]`); if (b) b.textContent = `${cur + 1}. ${c.name.split(' ')[0]}`; });
    ds.addEventListener('input', () => { c.desc = ds.textContent.trim(); saveSoon(); });
    $('#file').addEventListener('change', e => setImage(e.target.files[0]));
    const rm = $('#rmImg'); if (rm) rm.addEventListener('click', () => { c.img = ''; save(); renderPage(); });
    ['dragenter', 'dragover'].forEach(ev => frame.addEventListener(ev, e => { e.preventDefault(); frame.classList.add('drag'); }));
    ['dragleave', 'drop'].forEach(ev => frame.addEventListener(ev, e => { e.preventDefault(); frame.classList.remove('drag'); }));
    frame.addEventListener('drop', e => setImage(e.dataTransfer.files[0]));
  }

  function setImage(file) {
    if (!file || !file.type.startsWith('image/')) return toast('Choose an image file');
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const s = Math.min(1, 1000 / Math.max(im.width, im.height)), cv = document.createElement('canvas');
        cv.width = Math.round(im.width * s); cv.height = Math.round(im.height * s);
        cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
        data[cur].img = cv.toDataURL('image/jpeg', .85);
        if (save()) toast('Image saved'); renderPage();
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  }

  const download = (name, text, type) => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
  };

  $('#dlHtml').onclick = () => {
    const clone = document.documentElement.cloneNode(true);
    clone.querySelector('#seed').textContent = JSON.stringify(data).replace(/</g, '\\u003c');
    clone.querySelector('#fx').innerHTML = ''; clone.classList.remove('paused'); clone.querySelectorAll('#spot,.wipe,.trail').forEach(n => n.remove()); clone.querySelector('#tabs').innerHTML = ''; clone.querySelector('#panel').innerHTML = '';
    clone.querySelector('#toast').className = 'toast'; clone.style.removeProperty('--accent');
    download('master-roster.html', '<!DOCTYPE html>\n' + clone.outerHTML, 'text/html');
    toast('Portable page downloaded');
  };
  $('#exp').onclick = () => { download('roster.json', JSON.stringify(data, null, 2), 'application/json'); toast('Roster exported'); };
  $('#imp').onclick = () => $('#impFile').click();
  $('#impFile').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    f.text().then(t => { data = JSON.parse(t); save(); go(0); toast('Roster imported'); }).finally(() => e.target.value = '');
  };
  $('#rst').onclick = () => { data = structuredClone(SEED); localStorage.removeItem(KEY); go(0); toast('Roster reset'); };

  $('#tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) go(+b.dataset.i); });
  document.addEventListener('keydown', e => {
    if (e.target.isContentEditable) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') go(cur + 1, true);
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') go(cur - 1, true);
  });
  document.addEventListener('visibilitychange', () => document.documentElement.classList.toggle('paused', document.hidden));
  addEventListener('resize', () => placeInd(true));
  go(0);
})();
</script>
